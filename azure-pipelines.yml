# Pipeline CI/CD para la aplicación Python en Azure DevOps
# Equivalente a Jenkinsfile (Práctica 2), ci.yml GitHub Actions (Práctica 3)
# y .gitlab-ci.yml (Práctica 4)

# Parámetros de ejecución manual (equivalente a workflow_dispatch en GitHub Actions)
parameters:
  - name: RUN_CD
    displayName: 'Ejecutar CD (despliegue)?'
    type: boolean
    default: false
  - name: DEPLOY_ENV
    displayName: 'Entorno de despliegue'
    type: string
    default: DEV
    values:
      - DEV
      - PRO

# Trigger automático en develop y master
trigger:
  branches:
    include:
      - develop
      - master
      - feat/*

# Trigger en Pull Requests hacia develop y master
pr:
  branches:
    include:
      - develop
      - master

# Variables globales reutilizables en todos los stages y jobs
variables:
  IMAGE_NAME: devops-python-app
  APP_URL: http://localhost:5000

# ─────────────────────────────────────────────
# STAGE CI
# ─────────────────────────────────────────────
stages:
  - stage: CI
    displayName: 'Integración Continua'
    jobs:

      # Job de tests unitarios ejecutado dentro de un contenedor Python
      - job: Tests
        displayName: 'CI - Tests unitarios'
        pool:
          vmImage: ubuntu-latest
        # Contenedor Docker donde se ejecuta el job (equivalente a container: en GHA)
        container: python:3.6-slim
        steps:
          - checkout: self

          - script: |
              echo "Rama: $(Build.SourceBranchName)"
              echo "Commit: $(Build.SourceVersion)"
              echo "IMAGE_NAME: $(IMAGE_NAME)"
              echo "APP_URL: $(APP_URL)"
            displayName: 'Información del entorno'

          - script: |
              pip install -r requirements.txt
              pytest -q
            displayName: 'Instalar dependencias y ejecutar tests'

      # Job de construcción de la imagen Docker
      - job: DockerBuild
        displayName: 'CI - Docker Build'
        dependsOn: Tests
        pool:
          vmImage: ubuntu-latest
        steps:
          - checkout: self

          - script: |
              docker build -t $(IMAGE_NAME) -f Dockerfile .
              echo "Imagen $(IMAGE_NAME) construida correctamente"
            displayName: 'Construir imagen Docker'

  # ─────────────────────────────────────────────
  # STAGE CD
  # ─────────────────────────────────────────────
  - stage: CD
    displayName: 'Despliegue Continuo'
    dependsOn: CI
    # Condición: solo ejecutar en develop o master Y si RUN_CD es true
    condition: |
      and(
        succeeded(),
        or(
          eq(variables['Build.SourceBranchName'], 'develop'),
          eq(variables['Build.SourceBranchName'], 'master')
        ),
        eq('${{ parameters.RUN_CD }}', 'true')
      )
    jobs:
      - job: Deploy
        displayName: 'CD - Despliegue con Docker Compose'
        pool:
          vmImage: ubuntu-latest
        steps:
          - checkout: self

          - script: |
              docker compose -f docker-compose.yml up -d
              sleep 20
              docker compose -f docker-compose.yml exec -T app curl -f http://localhost:5000/ || true
            displayName: 'Desplegar con Docker Compose y test e2e'

          # Limpieza garantizada aunque falle el job
          - script: |
              docker compose -f docker-compose.yml down --volumes
            displayName: 'Limpieza de recursos'
            condition: always()