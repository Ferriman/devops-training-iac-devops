apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: database
  namespace: argocd
spec:
  project: training-project
  source:
    repoURL: https://github.com/Ferriman/devops-training-iac-devops.git
    targetRevision: HEAD
    path: project-skeleton/k8s/02-database
  destination:
    server: https://kubernetes.default.svc
    namespace: database
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
