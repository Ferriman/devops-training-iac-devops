namespace: apps

webui:
  image: docker.io/training/webui:1.0
  replicaCount: 1
  servicePort: 80
  containerPort: 80

backendJava:
  image: docker.io/training/backend-java:1.0
  replicaCount: 1
  servicePort: 8080
  containerPort: 8080

backendPython:
  image: docker.io/training/backend-python:1.0
  replicaCount: 1
  servicePort: 5000
  containerPort: 5000
  env:
    DB_HOST: postgres.database.svc.cluster.local
    DB_PORT: "5432"
    DB_NAME: trainingdb
    DB_USER: training
    DB_PASSWORD: trainingpwd
