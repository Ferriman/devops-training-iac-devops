apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend-python
  namespace: apps
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backend-python
  template:
    metadata:
      labels:
        app: backend-python
    spec:
      containers:
        - name: backend-python
          image: docker.io/training/backend-python:1.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5000
          env:
            - name: DB_HOST
              value: postgres.database.svc.cluster.local
            - name: DB_PORT
              value: "5432"
            - name: DB_NAME
              value: trainingdb
            - name: DB_USER
              value: training
            - name: DB_PASSWORD
              value: trainingpwd
